name: design-kit-check
on: [push, pull_request]
permissions:
  contents: read
env:
  # CI never calls paid or live APIs and references no repository secrets.
  PROVIDER_MODE: fixture
  ALLOW_CLAUDE_EXECUTION: 'false'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm run check:secrets
      - run: npm test
  app:
    # Travel app: lint (tsc strict + unused checks, node --check), typecheck, unit tests (fixture only) and web build.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22.13.x', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build
