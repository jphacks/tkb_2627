ground:#fff;padding:9px 11px;color:var(--ink);font-size:13px}.filters input{flex:1;min-width:180px}.strip{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.strip button{border:1px solid var(--border);padding:8px 12px;background:white;border-radius:6px;font-size:12px;color:var(--ink)}.strip button.active{background:var(--ink);color:white}.stepindex{font:11px var(--mono);color:var(--blue);padding:4px 7px;background:#edf3f8;border-radius:4px;margin-right:8px}.summaryrow{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.summaryrow .tag{margin-left:auto}.cmd{position:relative;border:1px solid #d8e3e8;background:#f1f5f8;border-radius:7px;margin:12px 0}.cmd pre{font:12px/1.7 var(--mono);white-space:pre;overflow:auto;margin:0;padding:15px 75px 15px 15px}.cmd button{position:absolute;right:7px;top:7px;font-size:10px;border:1px solid var(--border);background:#fff;border-radius:5px;padding:4px 7px}.taskgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.lane{border:1px solid var(--border);background:#eaf0f4;border-radius:9px;padding:10px}.lane h3{margin:4px 4px 11px}.task{display:block;width:100%;text-align:left;padding:12px;border:1px solid var(--border);border-radius:7px;background:white;color:var(--ink);margin-bottom:8px}.task strong{display:block;font-size:12px;margin:6px 0;line-height:1.65}.task small{font-size:10px;color:var(--muted)}.pathlist{font:12px/1.8 var(--mono);overflow-wrap:anywhere}.divider{border:0;border-top:1px solid var(--border);margin:23px 0}dialog{width:min(820px,calc(100vw - 24px));max-height:91vh;padding:0;border:1px solid var(--border);border-radius:13px;color:var(--ink);box-shadow:0 20px 80px #102b4140}dialog::backdrop{background:#132b3c80;backdrop-filter:blur(2px)}.dialoghead{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--border);padding:17px 22px;display:flex;gap:15px;justify-content:space-between;align-items:start;z-index:1}.dialoghead h2{font-size:19px;margin:4px 0}.dialogbody{padding:20px 23px}.close{border:0;background:#eaf0f4;border-radius:6px;width:32px;height:32px;font-size:20px;color:var(--ink)}.json{font:11px/1.65 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;background:#f1f5f8;padding:12px;border-radius:6px;margin:8px 0}ul.compact{padding-left:19px;margin:8px 0;font-size:13px}ul.compact li{margin-bottom:7px}.bignum{font:12px var(--mono);color:var(--green)}footer{border-top:1px solid var(--border);padding-top:18px;margin-top:28px;font-size:11px;color:var(--muted)}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:11px 17px;color:white;background:var(--ink);border-radius:7px;font-size:12px;z-index:5}.hidden{display:none!important}.statuslegend{display:flex;flex-wrap:wrap;gap:7px}.rolelabel{border-left:4px solid var(--blue);padding-left:10px}.empty{padding:28px;color:var(--muted);text-align:center}.sources a{overflow-wrap:anywhere}.checklist{display:grid;gap:11px}.checklist div{background:#fff;border:1px solid var(--border);padding:16px;border-radius:8px}.crosslink{font-weight:650}.payload{display:grid;grid-template-columns:1fr 1fr;gap:13px}.payload .card{padding:15px}.viewtitle{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}.viewtitle .tag{font-size:10px}.stepsline{display:flex;gap:9px;flex-wrap:wrap;font-size:12px}.stepsline span{padding:6px 9px;background:#eaf2f7;border:1px solid var(--border);border-radius:6px}.mobilemenu{display:none}.flowselect{max-width:100%;width:100%}

</style></head><body><noscript>図と表示切替にはJavaScriptが必要です。HTMLをChrome等で開いてください。</noscript><div class="shell"><aside class="sidebar"><div class="brand">JPHacks <small>DESIGN KIT / v4</small></div><div class="navgroup" id="nav-caption"></div><nav id="nav" aria-label="資料の目次"></nav><div class="sidefoot"><strong>説明と実行指示を分離</strong><br>図・手順の正本は同梱JSON。<br>アプリ本体は未実装。<br><a id="other-link" href="#">別の資料へ</a></div></aside><main><div class="topbar"><span class="version">2026.10.23 / v4</span><span class="tag amber" id="statebadge">設計資料 / アプリ未実装</span></div><div id="content"></div><footer id="footer">設計の意図と実装済みの事実は区別しています。</footer></main></div><dialog id="dialog"><div class="dialoghead"><div><div class="eyebrow" id="dialog-kind"></div><h2 id="dialog-title"></h2></div><button class="close" id="close" aria-label="閉じる">×</button></div><div class="dialogbody" id="dialog-body"></div></dialog><div class="toast hidden" id="toast" role="status"></div><script type="application/json" id="design-data">__DATA__</script><script>
'use strict';
const D=JSON.parse(document.getElementById('design-data').textContent);const MODE='__MODE__';
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);const SYS=D.system;const N=Object.fromEntries(SYS.nodes.map(x=>[x.id,x]));const R=Object.fromEntries(SYS.relations.map(x=>[x.id,x]));const K=Object.fromEntries(D.contracts.map(x=>[x.id,x]));const T=Object.fromEntries(D.tasks.map(x=>[x.id,x]));let page='overview',flowId='F01',snapshot=D.snapshot||null,taskFocus='U01',taskMode='start';
const navSystem=[['overview','全体と利用範囲'],['context','C1｜システム全体'],['containers','C2｜実行単位と接続'],['local-components','C3｜本人の旅程生成'],['social-focus','C3｜SNSと権限'],['shared-components','C3｜共有サーバー全体'],['data-model','C4｜旅程・SNSデータ'],['claude-code','C4｜Claude接続の型'],['dynamic','動的図｜要求と応答'],['deployment','配置｜PCと公開範囲'],['contracts','入出力契約を確認'],['requirements','機能と確認点']];
const navDev=[['overview','4人で始める全体像'],['start','最初の起動・参加手順'],['management','情報の正本と同期'],['loop','作業・push・統合手順'],['tasks','タスクグラフと担当'],['ui','UIレビューと並列化'],['agents','4アカウントとAgent'],['acceptance','完成判定・引継ぎ'],['references','根拠・未確認事項']];
const button=(text,act,extra='')=>`<button class="btn" data-action="${E(act)}" ${extra}>${E(text)}</button>`;
const field=(label,val)=>`<div class="field"><small>${E(label)}</small><div>${E(val)}</div></div>`;
const card=(title,body)=>`<div class="card"><h3>${E(title)}</h3>${body}</div>`;
const note=(t,c='')=>`<div class="note ${c}">${t}</div>`;
const list=a=>`<ul class="compact">${a.map(x=>`<li>${E(x)}</li>`).join('')}</ul>`;
function heading(k,t,desc=''){return `<div class="eyebrow">${E(k)}</div><h1>${E(t)}</h1>${desc?`<p class="lead">${E(desc)}</p>`:''}`}
function tag(t,c=''){return `<span class="tag ${c}">${E(t)}</span>`}
function command(s){return `<div class="cmd"><pre>${E(s)}</pre><button data-copy>コピー</button></div>`}
function sources(){return `<div class="sources stack">${D.sources.map(s=>`<div><span class="inlineid">${s.id}</span> <a href="${E(s.url)}" target="_blank" rel="noopener noreferrer">${E(s.title)}</a><p class="small muted">${E(s.note)}</p></div>`).join('')}</div>`}
function table(headers,rows,cls=''){return `<div class="tablewrap ${cls}"><table><thead><tr>${headers.map(x=>`<th>${E(x)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function fig(id,title,kind='communication'){const legend=kind==='data'?'参照線：外部キー名と 1 / 0..* の対応。通信の矢印ではありません。':kind==='tasks'?'矢印：前提タスクの統合・確認後に、後続へ進めます。':kind==='code'?'矢印：入力型・関数呼出し・結果型。公開APIの通信ではありません。':'<span><i class="linekey"></i>要求・入力</span><span><i class="linekey response"></i>応答・結果</span><span>箱・矢印を押すと具体例</span>';return `<div class="figure" data-figure="${E(id)}"><div class="figurehead"><b>${E(title)}</b><div class="controls"><button data-zoom="out" aria-label="図を縮小">−</button><output>100%</output><button data-zoom="in" aria-label="図を拡大">＋</button><button data-zoom="fit">全体</button><button data-zoom="reset">原寸</button><button data-expand="figure">拡大画面</button></div></div><div class="viewport">${D.figures[id]||''}</div><div class="legend">${legend}</div></div>`}
function ioRows(v){return table(['通信の向き','送る情報','戻ってくる情報'],v.relations.map(id=>{let r=R[id];return [`<button class="btn" data-inspect="edge=${id}">${E(N[r.source].label)} → ${E(N[r.target].label)}</button><br><small>${E(r.protocol)} / ${r.contract}</small>`,E(r.send),`<span class="out">${E(N[r.target].label)} → ${E(N[r.source].label)}<br>${E(r.receive)}</span>`]}),'io')}
function systemOverview(){return heading('SYSTEM DESIGN / C4','何を渡し、何が戻るか。','システム設計だけを扱う資料です。C4の各階層、機能ごとの動的図、実行配置と入出力を同じモデルから表示しています。')+`<div class="grid three">${card('旅程を考えるAI','<div class="metric">Claude</div><p class="small muted">本人PCの公式Claude Codeから利用。モデル自体はAnthropic側。</p>')}${card('旅程とSNSの正本','<div class="metric">共通サーバー</div><p class="small muted">本人PCでホストしても、各ブラウザではなく共有DBに保存。</p>')}${card('図で追える範囲',`<div class="metric">往復＋保存＋権限</div><p class="small muted">Claudeへの入力だけで終わらず、候補返却・保存・画面表示まで。</p>`)}</div><div class="card mt"><h2>まず、この3つから</h2><div class="buttons">${button('Claudeとの往復を見る','flow:F01')}${button('SNS投稿と公開を追う','flow:F05')}${button('サーバーの境界を見る','page:containers')}</div><p class="small muted mt">コードの細部を読む前に、動的図の番号で処理を追えます。矢印を押すと、入力・応答・エラー・JSONの実例を確認できます。</p></div><div class="grid mt">${card('本人が生成する流れ','<p>条件入力 → 202で受付 → Claudeが候補を生成 → プログラムが検証 → 共通DBへ候補保存 → 画面へ結果 → 採用した旅程を保存。</p><p class="small muted">ジョブ受付と完成結果の応答を混同しません。採用とSNS公開も別操作です。</p>')}${card('SNSで共有する流れ','<p>非公開の旅程 → 公開前プレビュー → 安全化した固定コピー → 投稿 → 閲覧者の現在の権限を確認 → 一覧・詳細を返す。</p><p class="small muted">他人の旅程をコピーすると、新しい所有者の下書きになります。</p>')}</div><div class="mt">${note('<b>利用範囲：</b>共有URLはSNS・保存・手動編集を提供します。Claude生成は本人PCの入口です。第三者の要求を開発者Proへ中継せず、本人利用と製品配布の適用条件はA01で実機と公式資料を照合します。','warn')}</div><div class="card mt"><h2>設計と実装の状態</h2><p>この資料は<b>実装前の設計</b>です。画面や図が表示できることと、旅行アプリが実装できたことは別です。全${D.requirements.length}要件・${D.tasks.length}タスクは実装対象として残しています。</p><a class="btn" href="DEVELOPMENT_GUIDE.html">4人の開始手順は別資料 →</a></div>`}
function architecture(id){let v=SYS.views.find(x=>x.id===id);return heading(v.level,v.title,v.note)+`<div class="buttons" style="margin-bottom:15px">${v.scope!=='旅行Webシステム'?button('上位の構成を見る','page:'+(['shared','personal'].includes(v.scope)?'containers':'context')):''}${button('処理順を動的図で見る','page:dynamic')}</div>`+fig(v.id,v.title)+`<div class="mt">${note('原寸で読み、左右・上下にスクロールできます。「全体」は全景の確認用です。図の箱から内部の階層へ進めます。')}</div><details class="mt" open><summary>この図の入出力一覧</summary><div class="detailinner">${ioRows(v)}</div></details>`}
function dataView(){let m=D.dataModel;return heading('C4 CODE / 永続化Repository','旅程とSNSは、何を保存するのか。',m.status)+`<div class="strip"><button class="active" data-dataview="data-social">SNSに関係する6テーブル</button><button data-dataview="data-model">全12テーブル</button></div><div id="data-fig">${fig('data-social',m.title,'data')}</div><div class="mt">${note('<b>元旅程と公開投稿は別：</b>postsは元tripのIDと版を記録しますが、閲覧するのはpost_snapshotsの安全化した固定コピーです。')}</div><div class="grid mt">${m.tables.map(t=>card(t.label+ ' / '+t.id,`<div class="pathlist">${t.fields.map(E).join('<br>')}</div><p class="small muted mt">${E(t.note)}</p>`)).join('')}</div><div class="card mt"><h2>保存ルール</h2>${list(m.rules)}</div>`}
function codeView(){return heading('C4 CODE / Claude接続アダプター','Claudeからの結果を、保存前に検証する。',D.codeModel.status)+fig('claude-code',D.codeModel.title,'code')+`<div class="grid mt">${D.codeModel.types.map(t=>card(t.id,`<div class="pathlist">${t.fields.map(E).join('<br>')}</div><p class="small muted mt">${E(t.note)}</p>`)).join('')}</div>`}
function dynamicView(){let f=D.flows.find(x=>x.id===flowId);return heading('C4 DYNAMIC / SEQUENCE STYLE','機能を、要求から応答まで追う。','同じC4モデルの要素を並べ、処理順を番号で示します。実線が要求、破線が応答。矢印を選ぶと入出力・権限・失敗を確認できます。')+`<div class="filters"><select class="flowselect" id="flow-select" aria-label="動的図の選択">${D.flows.map(x=>`<option value="${x.id}" ${x.id===flowId?'selected':''}>${x.id}｜${E(x.title)}</option>`).join('')}</select></div>`+fig(f.id,f.title)+`<div class="grid mt">${card('完了時にどうなるか',`<p class="small">${E(f.success)}</p>`)}${card('失敗・例外ではどうするか',`<p class="small">${E(f.failures)}</p>`)}</div><details class="mt" open><summary>番号順の入力と戻り値</summary><div class="detailinner">${table(['順番','送信元 → 送信先','処理・データ','契約'],f.steps.map(s=>{let a,b;if(s.direction==='self'){a=b=s.actor}else{let r=R[s.relation];[a,b]=s.direction==='request'?[r.source,r.target]:[r.target,r.source]}return [String(s.number).padStart(2,'0'),E(N[a].label)+(a===b?'（内部処理）':' → '+E(N[b].label)),E(s.label)+`<p class="small muted">${E(s.detail)}</p>`,`<button class="btn" data-inspect="step=${f.id}:${s.number-1}">${s.direction==='self'?'内部処理':s.contract}</button>`]}))}</div></details><div class="buttons mt">${f.tasks.map(t=>`<span class="tag">担当タスク ${t}</span>`).join('')}${button('採用・保存を見る','flow:F03')}${button('SNS投稿を見る','flow:F05')}</div>`}
function deploymentView(){return heading('C4 DEPLOYMENT / 本人PCでのデモ','どこで動き、どこまで公開するか。','同じPCに置く場合も、本人のClaude実行と共有データ用サーバーは別プロセス・別入口です。')+fig('deployment','本人PCの初期配置')+`<div class="grid mt">${card('4311：本人用','<p>本人用画面とApp Server。127.0.0.1だけで待受。公式Claude Codeを起動します。Host・Origin・CSRF・ペアリング・本人アプリセッションを確認。</p><p class="small muted">Tunnelで公開しません。共有サーバーから起動要求を逆転送しません。</p>')}${card('4310：共有用','<p>共通Web画面・認証・旅程保存・SNS。HTTPS公開はこの入口のみ。DBは非公開のサーバーファイルです。</p><p class="small muted">本人PC停止中は利用できません。認可・バックアップ・復元を確認します。</p>')}</div><div class="mt">${note('Claudeの認証は公式CLIが管理します。自作App Serverがtokenを抽出して転送する構成ではありません。本人用の技術実証と適用条件は実装開始時に確認します。','warn')}</div>`}
function contractView(){return heading('INTERFACES / 入力と戻り値','曖昧な「連携」で済ませない。','自作アプリの契約です。記載したエンドポイントが既に稼働している意味ではありません。数字やIDは説明用の例です。')+`<div class="filters"><input id="contract-search" placeholder="生成、SNS、保存、K03などで探す" aria-label="契約の検索"></div><div id="contract-cards" class="grid">${D.contracts.map(k=>`<div class="card contractcard" data-search="${E(k.id+' '+k.name+' '+k.request+' '+k.transport)}"><span class="inlineid">${k.id}</span><h3 class="mt">${E(k.name)}</h3><p class="pathlist">${E(k.transport)}</p>${field('送るもの',k.request)}${field('戻るもの',k.response)}<div class="buttons mt">${button('権限・失敗・具体例','inspect:contract='+k.id)}</div></div>`).join('')}</div>`}
function requirementsView(){return heading('SCOPE / 全機能を維持','作るものと、確認が必要なもの。','30要件を削らず、タスクと紐付けています。初期案による解釈と外部条件の未確認は、実装済みとは別に表示します。')+`<div class="grid">${D.requirements.map(q=>card(q.id+' '+q.title,`<p class="small">${E(q.acceptance)}</p><p class="small muted">対応：${D.tasks.filter(t=>t.requirements.includes(q.id)).map(t=>t.id).join(', ')}</p>`)).join('')}</div><div class="card mt"><h2>公開範囲の判定</h2>${table(['操作','匿名','所有者本人','所属メンバー','その他'],D.visibility.map(v=>[v.operation,v.anonymous,v.owner,v.member,v.other].map(E)))}</div><div class="note warn mt">Googleマップの保存リストへの自動登録と、Maps URLで開く機能は同じではありません。ICS出力もカレンダーへの直接書込みとは別です。元要望との差は残し、実装前に対応可否と権限を確認します。</div><details class="mt"><summary>公式資料と設計上の制約</summary><div class="detailinner">${sources()}</div></details>`}
function devOverview(){return heading('DEVELOPMENT OPERATIONS / C4とは別資料','4人が、同じ情報で開発する。','誰が何から始め、何をGitHubへ残し、どの時点で次の人が使えるかを定めています。別アカウントのClaude同士が自動で会話履歴を共有する前提にはしません。')+`<div class="grid three">${card('最初に構築する人','<div class="metric">M1だけ</div><p class="small muted">既存repoを使い、型と骨格を共有。残り3人はclone後に担当開始。</p>')}${card('実際の進捗の正本','<div class="metric">GitHub Issue</div><p class="small muted">仕様はGit、コードはPR。HTMLは取得時点の読取りビュー。</p>')}${card('開発の並列化','<div class="metric">UIを先行</div><p class="small muted">初期画面はfixture。実Claude・地図APIを待たず触れる状態へ。</p>')}</div><div class="card mt"><div class="buttons">${button('M1の開始手順へ','role-start:M1')}${button('M2〜M4の参加手順へ','page:start')}${button('どの情報をどこに残すか','page:management')}${button('タスクグラフを見る','page:tasks')}</div></div><div class="grid mt">${D.roles.map(r=>card(r.id+' '+r.role,`<p class="small">${E(r.first)}</p><p class="small muted">${E(r.handoff)}</p>`)).join('')}</div><div class="mt">${note('<b>今動くのは設計キットの補助ツールです。</b>旅行アプリのsetup/dev/startは、M1が初期構築で実装してから使います。手順には「今実行可能」と「実装後」を分けています。','warn')}</div>`}
function stepCard(s,open=false){return `<details class="runstep" data-who="${s.who.join(' ')}" ${open?'open':''}><summary><div class="summaryrow"><span class="stepindex">${s.id}</span><span>${E(s.title)}</span>${tag(s.who.join(' / '))}</div></summary><div class="detailinner"><p class="small muted">${E(s.when)}</p>${tag(s.availability,s.availability.includes('後')?'amber':'green')}${list(s.actions)}${command(s.commands.join('\n'))}${field('成功したら見えるもの',s.expected)}${field('失敗した場合',s.failure)}${field('次の動作',s.next)}</div></details>`}
function startView(){let initial=D.runbook.filter(x=>parseInt(x.id.slice(5))<=7);return heading('RUNBOOK / 開始と参加','最初に、誰が何を実行するか。','OWNER/REPO、DEFAULT_BRANCH、ISSUE_NUMBER、絶対パスは実値に置換します。秘密情報は貼り付けて共有しません。VS Code拡張を使う場合も、同じフォルダを開いて開始文を渡します。')+`<div class="filters"><select id="role-filter" aria-label="担当の手順"><option value="all">全員の手順</option>${D.roles.map(r=>`<option>${r.id}</option>`).join('')}</select></div><div class="note">M1がZIPを使う場合は配置後にマスターを読ませます。<b>完全な空フォルダから始める場合は、AI_MASTER_PROMPT.txtの全文を渡します。</b>短い開始文だけでは仕様を復元できません。</div>`+initial.map((s,i)=>stepCard(s,i<1)).join('')+`<div class="card mt"><h2>AIに渡す最初の一文</h2>${command('AI_MASTER_PROMPT.txtを読み、M1としてB01から実装を開始してください。人間への説明はSYSTEM_DESIGN.htmlとDEVELOPMENT_GUIDE.htmlで行い、最初のUIと3人への参加手順を先に共有してください。')}<p class="small muted">上の一文は、キットがフォルダに存在する場合専用です。</p></div>`}
function managementView(){return heading('INFORMATION FLOW / 4人の同期','何を、誰が、どこへ書き戻すか。','GitHubへpushするだけでは、別アカウントのClaudeへ設計変更は伝わりません。参照先と同期のタイミングを固定します。')+table(['情報','唯一の正本','誰が更新・いつ読む','同期と禁止事項'],D.management.map(x=>[E(x.item),E(x.truth),E(x.writer)+'<hr class="divider">'+E(x.reader),E(x.sync)+'<p class="small muted">'+E(x.prohibit)+'</p>']))+`<div class="grid mt">${D.collaboration.map(x=>card(x.title,list(x.steps))).join('')}</div><div class="card mt"><h2>引継ぎコメントの書式</h2>${command('Task: U01 / Owner: M2\nBranch: feat/m2/u01\nBase commit: <SHA> / Current commit: <SHA>\nPR: #<number> / Contract version: 1\nChanged paths: apps/web/...\nTests: <command, exit code, result>\nData: fixture または live\nHuman review: 未回答 / 承認 / 要修正\nBlocker: <必要なものと依頼先>\nNext: <次担当・次操作>')}</div><div class="note warn mt">Issueのassigneeは分散ロックではありません。担当変更と共有ファイルの編集順はM1が調整します。二重着手を検出したら勝手に上書きせず止めます。</div>`}
function loopView(){return heading('DAILY LOOP / 同期・実装・統合','pushと「使ってよい状態」を分ける。','作業ブランチへ頻繁に保存します。依存先を解除するのは、受入確認とレビューを経てdefault branchへ統合されたときです。')+`<div class="stepsline"><span>最新Issue・仕様を読む</span>→<span>担当branch/Worktree</span>→<span>実装とテスト</span>→<span>commit・push</span>→<span>別レビュー</span>→<span>M1がmerge</span>→<span>Issueをdone</span></div>`+D.runbook.filter(x=>['START07','START08','START09','START10','START11'].includes(x.id)).map((x,i)=>stepCard(x,i===0)).join('')}
function taskStatus(t){let s=snapshot?.tasks?.[t.id]?.status||'todo';let missing=t.dependsOn.filter(d=>snapshot?.tasks?.[d]?.status!=='done');return {raw:s,display:s==='todo'?(missing.length?'waiting':'ready'):s,missing}}
const statusNames={todo:'未着手',ready:'着手可能',waiting:'依存待ち',doing:'作業中',review:'レビュー',blocked:'阻害あり',done:'完了と記録'};
function tasksView(){let done=D.tasks.filter(t=>taskStatus(t).raw==='done').length;return heading('TASK GRAPH / DEPENDENCIES','タスクの依存と、着手の条件。',`${D.tasks.length}タスク・${D.tasks.reduce((n,t)=>n+t.dependsOn.length,0)}本の依存。初期状態は未着手です。現在の完了記録は${done}件。`)+`<div class="strip"><button class="active" data-taskmode="start">最初の並列作業</button><button data-taskmode="all">全タスクの依存</button><button data-taskmode="related">選択タスクの前後</button><button data-taskmode="board">担当別カード</button></div><div class="filters"><input id="task-search" placeholder="タスクID・機能を検索" aria-label="タスク検索"><select id="task-owner" aria-label="担当で絞る"><option value="all">全員</option>${D.roles.map(r=>`<option>${r.id}</option>`).join('')}</select><select id="task-ui" aria-label="UI依存で絞る"><option value="all">UI依存すべて</option><option value="none">UI確定を待たない</option><option value="prototype">UI試作</option><option value="approval">UI承認に依存</option></select></div><div id="task-display"></div><details class="mt"><summary>GitHubの実進捗を読み込む</summary><div class="detailinner"><p class="small">現状：${snapshot?'取得時刻 '+E(snapshot.fetchedAt):'実GitHub未接続。設計計画の表示。'}。HTMLを開いただけではライブ同期しません。各自の端末で取得したJSONを読み込みます。GitHub tokenはHTMLに渡しません。</p>${command('node scripts/github-sync.mjs snapshot --repo OWNER/REPO\nnpm run guide')}<input id="snapshot-file" type="file" accept="application/json,.json" aria-label="進捗JSONの読み込み"><p id="snapshot-message" class="small muted"></p></div></details>`}
function buildTaskSvg(tasks){let all=T,level={};function lv(id){if(level[id]!==undefined)return level[id];return level[id]=all[id].dependsOn.length?Math.max(...all[id].dependsOn.map(lv))+1:0}D.tasks.forEach(t=>lv(t.id));let uniq=[...new Set(tasks.map(t=>level[t.id]))].sort((a,b)=>a-b),slots={},pos={};tasks.forEach(t=>{let l=uniq.indexOf(level[t.id]);let row=slots[l]||0;slots[l]=row+1;pos[t.id]={x:45+l*285,y:50+row*126}});let w=Math.max(700,uniq.length*285+50),h=Math.max(430,Math.max(...Object.values(slots),1)*126+85);let out=[`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}"><defs><marker id="tarrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#8da5b5"/></marker></defs>`];let colors={M1:'#315e83',M2:'#168575',M3:'#a47c35',M4:'#7b5e9a'};for(let t of tasks){for(let d of t.dependsOn){if(!pos[d])continue;let a=pos[d],b=pos[t.id];out.push(`<path d="M${a.x+225},${a.y+45} C${a.x+255},${a.y+45} ${b.x-25},${b.y+45} ${b.x},${b.y+45}" stroke="#a1b2bf" stroke-width="1.5" fill="none" marker-end="url(#tarrow)"/>`)}}for(let t of tasks){let p=pos[t.id],title=t.title.match(/.{1,15}/gu)||[],s=taskStatus(t);out.push(`<a href="#task=${t.id}"><rect x="${p.x}" y="${p.y}" width="225" height="98" rx="8" fill="white" stroke="${colors[t.owner]}" stroke-width="2"/><text x="${p.x+12}" y="${p.y+21}" font-size="11" fill="${colors[t.owner]}" font-family="sans-serif">${t.id} / ${t.owner} / ${statusNames[s.display]}</text>${title.slice(0,2).map((tx,i)=>`<text x="${p.x+12}" y="${p.y+45+i*19}" font-size="12" fill="#20394b" font-family="sans-serif">${E(tx)}</text>`).join('')}<text x="${p.x+12}" y="${p.y+86}" font-size="10" fill="#687c8b" font-family="sans-serif">${t.uiDependency==='none'?'UIの確定を待たない':t.uiDependency==='prototype'?'UIの先行試作':'人間のUI判断が必要'}</text></a>`)}return out.join('')+'</svg>'}
function renderTasks(){let q=($('#task-search')?.value||'').toLowerCase(),owner=$('#task-owner')?.value||'all',ui=$('#task-ui')?.value||'all';let ts=D.tasks.filter(t=>(owner==='all'||t.owner===owner)&&(ui==='all'||t.uiDependency===ui)&&(!q||(t.id+t.title).toLowerCase().includes(q)));if(taskMode==='start'){let ids=new Set(['B01','B02','B03','G01','G02','B04','U01','U02','S01','S02','A01','A02','A03','D01','D05']);ts=ts.filter(t=>ids.has(t.id))}if(taskMode==='related'){let t=T[taskFocus];let ids=new Set([t.id,...t.dependsOn,...D.tasks.filter(x=>x.dependsOn.includes(t.id)).map(x=>x.id)]);ts=ts.filter(x=>ids.has(x.id))}let el=$('#task-display');if(!ts.length){el.innerHTML='<div class="empty">該当するタスクはありません。</div>';return}if(taskMode==='board'){el.innerHTML=`<div class="taskgrid">${D.roles.map(r=>`<div class="lane"><h3>${r.id} ${E(r.role)}</h3>${ts.filter(t=>t.owner===r.id).map(t=>`<button class="task" data-inspect="task=${t.id}"><small>${t.id} / ${statusNames[taskStatus(t).display]}</small><strong>${E(t.title)}</strong><small>前提：${t.dependsOn.join(', ')||'なし'}</small></button>`).join('')}</div>`).join('')}</div>`}else{D.figures.tasks=buildTaskSvg(ts);el.innerHTML=`<p class="small muted">表示 ${ts.length} / ${D.tasks.length}件。${taskMode==='related'?'選択中 '+taskFocus+' の直接の前提と後続。':''}すべてのhard dependencyは全件データに保持しています。</p>`+fig('tasks','タスク依存グラフ','tasks');initFigures(el)}document.querySelectorAll('[data-taskmode]').forEach(b=>b.classList.toggle('active',b.dataset.taskmode===taskMode))}
function uiView(){let s=D.runbook.find(x=>x.id==='START12');return heading('UI EARLY / 並行作業','UIを詰める間、内部機能を止めない。','共通の入力と出力の最小版を先に決め、テスト用データで画面を動かします。人間の判断が必要な画面だけ待ち、それ以外は進めます。')+`<div class="grid">${card('M2が先に進めるもの','<p>条件入力 → 候補比較 → 地図と行程表 → 編集 → SNS投稿の確認画面。</p><p class="small muted">初期はfixture。待機・失敗・unknownも表示し、本人が触って修正します。</p>')}${card('同時に進めるもの','<p>M1：DB・認証・SNS<br>M3：実データ・経路・日時<br>M4：本人サーバー・Claude・ジョブ</p><p class="small muted">U02の人間承認をbackend開始条件にしません。</p>')}</div>`+stepCard(s,true)+`<div class="card mt"><h2>UI変更が共通型へ影響する場合だけ調整</h2>${list(D.collaboration[0].steps)}</div><div class="buttons mt">${button('U01前後の依存を見る','task-related:U01')}</div>`}
function agentsView(){return heading('TEAM / 人とAgent','4つのアカウント、共有するのは成果物。','メインAgentが担当Issueを管理し、同じアカウント内の役割別Agentへ仕事を渡します。別アカウントの認証や会話履歴を共用しません。')+`<div class="grid">${D.roles.map(r=>card(r.id+' '+r.role,field('受け取るもの',r.receives)+field('返すもの',r.returns)+field('変更できる主な場所',r.paths.join('\n'))+field('独立レビューの相手',r.reviewer))).join('')}</div><div class="card mt"><h2>1アカウント内の役割</h2>${table(['Agent','担当','返す成果'],[['architect','境界・契約・依存を点検','変更案と影響するID'],['implementer','許可pathの実装','diff・commit候補・試験結果'],['ui-builder','画面とfixture','操作URL・スクリーンショット・確認点'],['test-author','正常/異常/権限の試験','再現手順・試験コード・実行結果'],['reviewer','実装とは別コンテキストで読取りレビュー','根拠付きの指摘・承認可否'],['doc-checker','図・契約・実装の照合','一致しないID・更新箇所']].map(r=>r.map(E)))}</div><div class="note mt">モデル名は実アカウントで利用可能なものだけ選びます。最初はwriter 1つ＋読取りreview等。独立した変更範囲でのみwriterを追加します。Agentを増やしてもPro利用枠は増えません。</div>`}
function acceptanceView(){return heading('ACCEPTANCE / 未達を隠さない','何ができたら、次へ進んでよいか。','コード生成・mock・実接続・人間承認を分けて記録します。テスト件数だけで設計や旅行アプリの完成を主張しません。')+`<div class="checklist">${['実Claudeの往復：条件を送る→構造化結果→検証→共通DB保存→画面表示。','2人のSNS：Aのgroup投稿をBが閲覧。Cは不可。B除外後に同じURLで拒否。','旅程コピー：新しいownerとID、元の秘密なし、日付変更後の要再検証。','同時編集：古いrevisionで409。他端末の変更を消さない。','本人入口の保護：共有URLからCLIを起動不可。認証・上限・timeoutでも勝手に課金方式を変えない。','永続化：再起動・別端末・バックアップ復元で同じ保存内容を確認。','UI：初回から操作可能。承認者・画面版・修正点を記録。','配布：新しいcloneから手順通り起動。未実装コマンドを動くものとして説明しない。'].map(x=>`<div>${E(x)}</div>`).join('')}</div>`+D.runbook.filter(x=>['START13','START14'].includes(x.id)).map(x=>stepCard(x)).join('')+`<div class="card mt"><h2>残るものを引き継ぐ</h2><p class="small">未実装、実データ未接続、Claude適用条件未解決、UI未承認は別々に残します。全機能の実装目標を保持しつつ、2日間で完了を保証する表現はしません。</p></div>`}
function referencesView(){return heading('SOURCES / 実行前の確認','未確認の条件を、曖昧にしない。','ここで決め直すのは既存の要望ではなく、実行に必要な権限や接続の可否です。')+`<div class="grid">${card('実行時に確認する値',list(['既存repoとdefault branch、3人の招待承認。','M1〜M4とGitHub login。','各PCのOSとツール版、サーバーの場所。','旅行APIのキー・上限・対応地域・保存とAI入力の条件。']))}${card('Claudeの扱い',`<p class="small">本人PCの公式CLIを使う方針は維持します。本人用途と配布の条件をA01で確認し、第三者の生成を本人Proへ中継しません。未解決でもUI・共有DB・SNSの作業は進められます。</p>`)}</div><div class="card mt"><h2>参照した公式資料</h2>${sources()}</div><div class="card mt"><h2>キットの検証状態</h2><p class="small">このHTMLとJSONの検証結果は同梱のVALIDATION_REPORT.txtに記録します。旅行アプリ、本人Claude、Google、実GitHubの書込み・公開は未実施です。</p></div>`}
function render(){let html;if(MODE==='system'){if(page==='overview')html=systemOverview();else if(SYS.views.some(v=>v.id===page))html=architecture(page);else if(page==='dynamic')html=dynamicView();else if(page==='data-model')html=dataView();else if(page==='claude-code')html=codeView();else if(page==='deployment')html=deploymentView();else if(page==='contracts')html=contractView();else html=requirementsView()}else{html=({overview:devOverview,start:startView,management:managementView,loop:loopView,tasks:tasksView,ui:uiView,agents:agentsView,acceptance:acceptanceView,references:referencesView}[page]||devOverview)()}$('#content').innerHTML=html;document.querySelectorAll('#nav button').forEach(b=>{b.classList.toggle('active',b.dataset.page===page);b.setAttribute('aria-current',b.dataset.page===page?'page':'false')});initFigures($('#content'));if(page==='tasks')renderTasks();$('#footer').textContent='モデル版 '+D.version+' / 設計キット。旅行アプリ本体は未実装。 / 正本ハッシュ '+D.modelHash.slice(0,12)}
function go(p){page=p;history.replaceState(null,'','#'+p);render();window.scrollTo({top:0,behavior:'instant'})}
function initFigures(root){root.querySelectorAll('.figure').forEach(f=>{let s=f.querySelector('svg');if(!s)return;let vb=s.viewBox.baseVal;if(!vb.width)return;f.dataset.w=vb.width;f.dataset.h=vb.height;let vp=f.querySelector('.viewport');setZoom(f,['context','data-social'].includes(f.dataset.figure)?Math.min(1,(vp.clientWidth-25)/vb.width):1);let drag=null;vp.addEventListener('pointerdown',ev=>{if(ev.target.closest('a'))return;drag={x:ev.clientX,y:ev.clientY,l:vp.scrollLeft,t:vp.scrollTop};});vp.addEventListener('pointermove',ev=>{if(!drag||!(ev.buttons&1))return;vp.scrollLeft=drag.l-(ev.clientX-drag.x);vp.scrollTop=drag.t-(ev.clientY-drag.y)});vp.addEventListener('pointerup',()=>drag=null);vp.addEventListener('pointerleave',()=>drag=null)})}
function setZoom(f,z){z=Math.max(.18,Math.min(2.8,z));f.dataset.zoom=z;let s=f.querySelector('svg');s.style.width=(+f.dataset.w*z)+'px';s.style.height=(+f.dataset.h*z)+'px';f.querySelector('output').textContent=Math.round(z*100)+'%'}
function show(title,kind,body){$('#dialog-title').textContent=title;$('#dialog-kind').textContent=kind;$('#dialog-body').innerHTML=body;if(!$('#dialog').open)$('#dialog').showModal()}
function contractBody(k){return `<p><span class="tag">${E(k.id)}</span> ${E(k.name)}</p>`+field('通信とルート',k.transport)+field('送る情報',k.request)+field('戻る情報',k.response)+field('認証と権限',k.auth)+field('失敗・例外',k.errors)+field('設計上の注意',k.notes)+`<details><summary>送信データと応答データの具体例（説明用）</summary><div class="detailinner"><h3>入力</h3><pre class="json">${E(JSON.stringify(k.exampleIn,null,2))}</pre><h3>戻り値</h3><pre class="json">${E(JSON.stringify(k.exampleOut,null,2))}</pre></div></details>`}
function inspect(key){let ix=key.indexOf('='),kind=key.slice(0,ix),id=key.slice(ix+1);if(kind==='node'){let n=N[id];if(!n)return;let rel=SYS.relations.filter(r=>r.source===id||r.target===id);let body=field('責任',n.role)+field('技術',n.tech)+field('入力',n.inputs||'下の通信関係を参照')+field('出力',n.outputs||'下の通信関係を参照')+field('実装担当と予定の場所',n.owner+' / '+n.path)+field('境界と注意',n.detail)+`<div class="buttons mt">${n.children.filter(x=>x!=='dynamic'||MODE==='system').map(v=>button('内部・処理を見る','page:'+v)).join('')}</div><h3 class="mt">この要素の入出力</h3>`+rel.map(r=>`<details><summary>${E(N[r.source].label)} → ${E(N[r.target].label)} / ${r.contract}</summary><div class="detailinner">${field('依頼',r.send)}${field('戻り',r.receive)}${button('データ詳細を見る','inspect:contract='+r.contract)}</div></details>`).join('');show(n.label,n.kind,body)}else if(kind==='edge'){let r=R[id];if(!r)return;show(N[r.source].label+' ⇄ '+N[r.target].label,'入出力 / '+r.id,field('往路',r.send)+field('復路',r.receive)+field('通信方式',r.protocol)+field('注意',r.detail)+contractBody(K[r.contract]))}else if(kind==='contract'){let k=K[id];if(k)show(k.id+' '+k.name,'入出力契約',contractBody(k))}else if(kind==='step'){let [fId,i]=id.split(':'),f=D.flows.find(x=>x.id===fId),s=f.steps[+i];show(String(s.number).padStart(2,'0')+' '+s.label,f.title,field('この段階の意味',s.detail||'矢印の方向で送るものと戻すものを区別します。')+(s.direction==='self'?field('入力',s.internalInput)+field('出力',s.internalOutput)+field('失敗時',s.internalFailure):contractBody(K[s.contract])))}else if(kind==='table'){let t=D.dataModel.tables.find(x=>x.id===id);show(t.id,'C4 Code / 永続化Repository',field('保存するもの',t.label)+field('主なフィールド',t.fields.join('\n'))+field('ルール',t.note))}else if(kind==='type'){let t=D.codeModel.types.find(x=>x.id===id);show(t.id,'C4 Code / Claude接続アダプター',field('種類',t.kind)+field('属性・操作',t.fields.join('\n'))+field('責任',t.note))}else if(kind==='task'){let t=T[id];if(!t)return;taskFocus=id;let st=taskStatus(t);show(t.id+' '+t.title,'実装タスク / '+statusNames[st.display],field('担当 / branch',t.owner+' / '+t.branch)+field('実行前に読む入力',t.inputArtifacts.join('\n'))+field('許可された変更範囲',t.writePaths.join('\n'))+field('前提タスク',t.dependsOn.join(', ')||'なし')+field('まだ完了していない依存',st.missing.join(', ')||'なし')+field('完了条件',t.acceptance)+field('具体的な検証',t.verification)+field('引継ぎの出力',t.handoff)+field('完了確認者',t.completionAuthority)+field('関連契約',t.contracts.join(', ')||'基盤・運用タスク')+`<div class="buttons mt">${button('このタスクの前後を見る','task-related:'+id)}${t.contracts.map(k=>button(k,'inspect:contract='+k)).join('')}</div>`)} }
function toast(t){$('#toast').textContent=t;$('#toast').classList.remove('hidden');setTimeout(()=>$('#toast').classList.add('hidden'),2300)}
async function copy(text){try{await navigator.clipboard.writeText(text);toast('コピーしました')}catch{let a=document.createElement('textarea');a.value=text;document.body.append(a);a.select();let ok=document.execCommand('copy');a.remove();toast(ok?'コピーしました':'ブラウザが拒否しました。本文を選択してコピーしてください。')}}
function action(s){if(s.startsWith('inspect:'))return inspect(s.slice(8));$('#dialog').close();if(s.startsWith('page:'))go(s.slice(5));else if(s.startsWith('flow:')){flowId=s.slice(5);go('dynamic')}else if(s.startsWith('task-related:')){taskFocus=s.slice(13);taskMode='related';go('tasks')}else if(s.startsWith('role-start:')){go('start');$('#role-filter').value=s.slice(11);filterSteps()}}
function filterSteps(){let role=$('#role-filter')?.value||'all';document.querySelectorAll('.runstep').forEach(x=>x.classList.toggle('hidden',role!=='all'&&!x.dataset.who.split(' ').includes(role)))}
document.addEventListener('click',ev=>{let ex=ev.target.closest('[data-expand]');if(ex){let f=ex.closest('.figure');f.classList.toggle('expanded');ex.textContent=f.classList.contains('expanded')?'戻す':'拡大画面';setZoom(f,Math.min(1,(f.querySelector('.viewport').clientWidth-25)/+f.dataset.w));return;}let b=ev.target.closest('[data-page]');if(b)return go(b.dataset.page);b=ev.target.closest('[data-action]');if(b)return action(b.dataset.action);b=ev.target.closest('[data-inspect]');if(b)return inspect(b.dataset.inspect);b=ev.target.closest('[data-copy]');if(b)return copy(b.closest('.cmd').querySelector('pre').textContent);b=ev.target.closest('button[data-zoom]');if(b){let f=b.closest('.figure'),z=+f.dataset.zoom;setZoom(f,b.dataset.zoom==='fit'?(f.querySelector('.viewport').clientWidth-25)/+f.dataset.w:b.dataset.zoom==='reset'?1:b.dataset.zoom==='in'?z*1.2:z/1.2);return}b=ev.target.closest('svg a');if(b){let href=b.getAttribute('href')||b.getAttribute('xlink:href');if(href?.startsWith('#')){ev.preventDefault();inspect(href.slice(1));return}}b=ev.target.closest('[data-taskmode]');if(b){taskMode=b.dataset.taskmode;renderTasks();return}b=ev.target.closest('[data-dataview]');if(b){$('#data-fig').innerHTML=fig(b.dataset.dataview,D.dataModel.title,'data');document.querySelectorAll('[data-dataview]').forEach(x=>x.classList.toggle('active',x===b));initFigures($('#data-fig'));return}});
document.addEventListener('change',async ev=>{if(ev.target.id==='flow-select'){flowId=ev.target.value;render()}if(ev.target.id==='role-filter')filterSteps();if(['task-owner','task-ui'].includes(ev.target.id))renderTasks();if(ev.target.id==='snapshot-file'){let file=ev.target.files[0];if(!file)return;try{if(file.size>3*1024*1024)throw new Error('大きすぎるファイルです');let j=JSON.parse(await file.text());if(!j.tasks||!j.fetchedAt||Number.isNaN(Date.parse(j.fetchedAt)))throw new Error('snapshot形式ではありません');for(let [id,v] of Object.entries(j.tasks))if(!T[id]||!['todo','doing','review','done','blocked'].includes(v.status))throw new Error('未知のタスク・状態');snapshot=j;render();toast('読取りスナップショットを反映しました。実行証拠の独立確認ではありません。')}catch(e){$('#snapshot-message').textContent='読込失敗：'+e.message}}});
document.addEventListener('input',ev=>{if(ev.target.id==='task-search')renderTasks();if(ev.target.id==='contract-search'){let q=ev.target.value.toLowerCase();document.querySelectorAll('.contractcard').forEach(c=>c.classList.toggle('hidden',!c.dataset.search.toLowerCase().includes(q)))}});
$('#close').addEventListener('click',()=>$('#dialog').close());$('#dialog').addEventListener('click',e=>{if(e.target===$('#dialog'))$('#dialog').close()});
const nav=MODE==='system'?navSystem:navDev;$('#nav-caption').textContent=MODE==='system'?'SYSTEM / C4 MODEL':'DEVELOPMENT / WORKFLOW';$('#nav').innerHTML=nav.map(([id,label])=>`<button data-page="${id}">${E(label)}</button>`).join('');$('#other-link').textContent=MODE==='system'?'開発手順のHTMLへ →':'システム設計のHTMLへ →';$('#other-link').href=MODE==='system'?'DEVELOPMENT_GUIDE.html':'SYSTEM_DESIGN.html';let hash=location.hash.slice(1);if(nav.some(x=>x[0]===hash))page=hash;render();
</script></body></html>
